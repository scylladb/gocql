name: "Docs / Report PR"

on:
  workflow_run:
    workflows: ["Docs / Build PR"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: docs-report-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Update docs build comment
        uses: scylladb/sphinx-scylladb-theme/.github/actions/docs-report@ee13c40833531a57be3f4926d1f58cab1927817e
