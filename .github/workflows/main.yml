name: Build

on:
  workflow_call:
    inputs:
      target_commit:
        description: Full commit SHA to build when called by the release workflow
        required: true
        type: string
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"
      - "docs/**"
      - .github/workflows/docs-*
      - .github/workflows/bench-tests.yml
      - .github/workflows/extended-ci-longevity-large-partitions-with-network-nemesis-1h-test.yml
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - .github/workflows/docs-*
      - .github/workflows/bench-tests.yml
      - .github/workflows/extended-ci-longevity-large-partitions-with-network-nemesis-1h-test.yml

# Supersede in-flight runs for the same pull request. Without this, every push
# to a PR leaves the previous run's build, seven cluster jobs and coverage to
# finish, so a five-push PR pays for five pipelines. Pull requests share one
# stable ref, so a new push cancels the old run; non-PR runs (master push, the
# release workflow's call) are keyed by SHA instead, so they never replace one
# another -- the default `queue: single` would otherwise drop an intermediate
# master build when a third push arrives before the first has finished, and a
# release build must never be cancelled by a later one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint is split out from build-amd64 so the cluster jobs no longer queue behind
  # the full amd64 unit suite, which is several times longer than linting. It is
  # the arch-independent half of `make check` (golangci-lint, `go mod tidy -diff`,
  # the lz4 tag pin); `make check` also builds with `-tags all`, which is what
  # proves the tree compiles before any cluster is brought up. check-lz4-pin now
  # reads tags from the remote (git ls-remote), so this checkout stays shallow.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target_commit || github.sha }}

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: bin/
          key: golangci-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            golangci-bin-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            lz4/go.sum
            tests/bench/go.sum
            go.sum

      - name: Run linters
        run: make check

  build-amd64:
    name: Build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target_commit || github.sha }}

      # Only the generated PKI (test-unit's .prepare-pki prerequisite) is worth
      # restoring here. The CCM repositories, JDK and bin/ the old combined entry
      # carried belong to the integration jobs; pulling multi-gigabyte archives
      # this lane never touches only made every cache miss slower. Linting, which
      # is what used to need bin/, lives in the lint job above.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: testdata/pki
          key: pki-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            pki-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            lz4/go.sum
            tests/bench/go.sum
            go.sum

      - name: Run unit tests
        run: make test-unit

  # The arm64 counterpart, and the reason it exists: pierrec/lz4 ships hand-written
  # per-architecture decode assembly (internal/lz4block/decode_arm64.s), so the code
  # behind LZ4Compressor.Decode and AppendDecompressed -- and therefore behind every
  # compressed native-protocol-v5 segment on a Graviton or Apple-silicon deployment --
  # had no gate at all before this lane existed. The last two bumps of that dependency
  # both reworked exactly that file.
  #
  # It builds and tests but does not lint, which is why it is not `make check`:
  # golangci-lint and `go mod tidy -diff` are architecture-independent, so running the
  # whole target here would only re-download an arm64 golangci-lint to repeat the amd64
  # result. `make build` is the one part of it that is not -- and it is not redundant
  # with the unit tests either, since `go test` never compiles the `all`-tagged non-test
  # files (integration_only.go, internal/ccm, internal/debug/debug_on.go).
  #
  # No actions/cache step, deliberately: this lane needs none of what the
  # integration jobs cache (CCM repositories, a JDK, get-version in bin/), and
  # nothing it does need is expensive to recreate -- setup-go caches the Go
  # modules under its own arch-scoped key, and test-lz4 needs neither the
  # generated PKI nor the cluster tooling.
  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target_commit || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            lz4/go.sum
            tests/bench/go.sum
            go.sum

      - name: Build
        run: make build

      # Only the nested lz4 module's tests: its per-architecture decode assembly
      # is the entire reason this lane exists, and the root module's tests are
      # architecture-independent. test-unit would repeat the whole root suite
      # here to no effect; the root's use of the arm64 assembly is covered end to
      # end by the arm64 integration lane (TEST_COMPRESSOR=lz4).
      - name: Run lz4 unit tests
        run: make test-lz4

  test-integration-scylla:
    name: Integration Tests On Scylla (${{ matrix.scylla-version }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    # Only on lint: the cluster jobs consume no artifact from build-amd64, so
    # depending on it merely serialized the full amd64 unit suite ahead of every
    # cluster bring-up. Lint still fails fast on an unbuildable or unlinted tree,
    # which is what this gate is actually for.
    needs: [lint]
    permissions:
      contents: read
    strategy:
      matrix:
        scylla-version: [LATEST, PRIOR, LTS-LATEST, LTS-PRIOR]
        arch: [amd64]
        # arm64 is pinned to one version on purpose: this lane is here to show the
        # driver works end to end on aarch64, not to re-cover every ScyllaDB
        # release. `arch` is already a matrix key, so this entry cannot merge into
        # an existing combination and GitHub adds it as a fifth one instead.
        include:
          - scylla-version: LATEST
            arch: arm64
      fail-fast: false
    env:
      SCYLLA_VERSION: ${{ matrix.scylla-version }}
      # The arm64 entry is the lane that exists for pierrec/lz4's hand-written
      # internal/lz4block/decode_arm64.s, so run it against that code rather than
      # against the snappy default: LZ4Compressor.Decode and AppendDecompressed are
      # the entry points into that assembly, and nothing else here reaches it end to
      # end. Possible only now that the root harness can build the nested lz4 module
      # -- createCluster's `case "lz4"` is what this selects. snappy keeps its
      # coverage on the five amd64 lanes.
      #
      # Both arms of the expression are non-empty strings on purpose: TEST_COMPRESSOR
      # is a `?=` default in the Makefile, so an empty value would still count as set
      # and would silently select no-compression on those five.
      TEST_COMPRESSOR: ${{ matrix.arch == 'arm64' && 'lz4' || 'snappy' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target_commit || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      # The environment is cached as four independent entries rather than one
      # combined key. A single entry keyed on the Makefile meant any edit -- even
      # an unrelated CCM or Java version bump -- discarded the pip wheels, the CCM
      # checkout, the JDK and the generated PKI together and re-downloaded all of
      # it; restore-keys let each entry fall back to the previous revision
      # instead of starting cold. runner.arch stays in every key because
      # runner.os is "Linux" on either architecture and bin/ holds an
      # arch-specific get-version.
      #
      # The CCM entry is keyed per distribution: install-cassandra-ccm and
      # install-scylla-ccm both pip-install a package named `ccm` and record the
      # active one in ~/.ccm/ccm-type, so a shared entry would hand, say, the
      # Scylla job a ~/.local holding Cassandra CCM. Caching the stamp files is
      # new: without them .prepare-scylla-ccm/.prepare-cassandra-ccm reinstalled
      # CCM from git on every single job. ~/.sdkman is absent on the arm64 image;
      # actions/cache is content to skip a path that is not there.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /home/runner/.local
            /home/runner/.ccm/ccm-type
            /home/runner/.ccm/ccm-version
          key: ccm-install-scylla-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ccm-install-scylla-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.sdkman
          key: sdkman-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            sdkman-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            testdata/pki
            bin/
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            tools-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            lz4/go.sum
            tests/bench/go.sum
            go.sum

      - name: Get scylla version
        id: scylla-version
        run: make resolve-scylla-version

      - name: Pull CCM image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.scylla-version.outputs.value != 'NOT-FOUND'
        id: ccm-cache
        with:
          path: ~/.ccm/repository
          key: ccm-scylla-${{ runner.os }}-${{ runner.arch }}-${{ steps.scylla-version.outputs.value }}

      - name: Download ScyllaDB (${{ steps.scylla-version.outputs.value }}) image
        if: steps.ccm-cache.outputs.cache-hit != 'true' && steps.scylla-version.outputs.value != 'NOT-FOUND'
        run: make download-scylla

      - name: Save CCM ScyllaDB image into the cache
        if: steps.ccm-cache.outputs.cache-hit != 'true' && steps.scylla-version.outputs.value != 'NOT-FOUND'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ccm/repository
          key: ccm-scylla-${{ runner.os }}-${{ runner.arch }}-${{ steps.scylla-version.outputs.value }}

      - name: Run integration suite with ScyllaDB ${{ matrix.scylla-version }}(${{ steps.scylla-version.outputs.value }})
        if: steps.scylla-version.outputs.value != 'NOT-FOUND'
        run: make test-integration-scylla

      # amd64 only, for the same reason the arm64 lane covers one version: it is
      # here to show the driver works end to end on aarch64, not to re-run every
      # pass the amd64 lane already makes.
      - name: Run CCM integration suite with ScyllaDB ${{ matrix.scylla-version }}(${{ steps.scylla-version.outputs.value }})
        if: matrix.arch == 'amd64' && steps.scylla-version.outputs.value != 'NOT-FOUND'
        run: TEST_INTEGRATION_TAGS="ccm gocql_debug" make test-integration-scylla

  test-integration-cassandra:
    name: Integration Tests On Cassandra (${{ matrix.cassandra-version }}, ${{ matrix.suite }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 120
    # Only on lint: the cluster jobs consume no artifact from build-amd64, so
    # depending on it merely serialized the full amd64 unit suite ahead of every
    # cluster bring-up. Lint still fails fast on an unbuildable or unlinted tree,
    # which is what this gate is actually for.
    needs: [lint]
    # This job had no permissions block at all, having had no arm64 counterpart to
    # force the question, so it ran on the repository default while its neighbour was
    # pinned -- and it is the one job that hands GITHUB_TOKEN to a make target.
    permissions:
      contents: read
    strategy:
      matrix:
        cassandra-version: [5-LATEST, 4-LATEST]
        # The 5-LATEST lane is two jobs: the v4 suite plus the native-protocol-v5
        # suite. They are split so the v5 run boots its own cluster in parallel
        # instead of running as the tail of one runner and adding its ~2.5m serially.
        suite: [default, protocol-v5]
        # One value today. It is spelled as a matrix dimension so this job reads the
        # same as the ScyllaDB one above and so an arm64 lane is one entry rather
        # than a copied job.
        arch: [amd64]
        exclude:
          # 4.x has no native protocol v5 to negotiate.
          - cassandra-version: 4-LATEST
            suite: protocol-v5
      fail-fast: false
    env:
      CASSANDRA_VERSION: ${{ matrix.cassandra-version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target_commit || github.sha }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      # Same four-way split as the ScyllaDB job above; see the comment there. The
      # CCM entry is keyed ccm-cassandra- so it never restores a ~/.local built
      # for Scylla CCM (and vice versa).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /home/runner/.local
            /home/runner/.ccm/ccm-type
            /home/runner/.ccm/ccm-version
          key: ccm-install-cassandra-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            ccm-install-cassandra-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /home/runner/.sdkman
          key: sdkman-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            sdkman-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            testdata/pki
            bin/
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            tools-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            lz4/go.sum
            tests/bench/go.sum
            go.sum

      - name: Get cassandra version
        id: cassandra-version
        run: make resolve-cassandra-version

      - name: Pull CCM image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.cassandra-version.outputs.value != 'NOT-FOUND'
        id: ccm-cache
        with:
          path: ~/.ccm/repository
          key: ccm-cassandra-${{ runner.os }}-${{ runner.arch }}-${{ steps.cassandra-version.outputs.value }}

      - name: Download Cassandra (${{ steps.cassandra-version.outputs.value }}) image
        if: steps.ccm-cache.outputs.cache-hit != 'true' && steps.cassandra-version.outputs.value != 'NOT-FOUND'
        run: make download-cassandra

      - name: Save CCM Cassandra image into the cache
        if: steps.ccm-cache.outputs.cache-hit != 'true' && steps.cassandra-version.outputs.value != 'NOT-FOUND'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ccm/repository
          key: ccm-cassandra-${{ runner.os }}-${{ runner.arch }}-${{ steps.cassandra-version.outputs.value }}

      - name: Run integration suite with Cassandra ${{ matrix.cassandra-version }}(${{ steps.cassandra-version.outputs.value }})
        if: matrix.suite == 'default' && steps.cassandra-version.outputs.value != 'NOT-FOUND'
        run: make test-integration-cassandra

      - name: Run CCM integration suite with Cassandra ${{ matrix.cassandra-version }}(${{ steps.cassandra-version.outputs.value }})
        if: matrix.suite == 'default' && steps.cassandra-version.outputs.value != 'NOT-FOUND'
        run: TEST_INTEGRATION_TAGS="ccm gocql_debug" make test-integration-cassandra

      # Native protocol v5 is never negotiated automatically (discoverProtocol caps at
      # v4), so at the default TEST_CQL_PROTOCOL=4 every ProtoVersion >= 5 test skips and
      # the whole suite runs over v4 framing. This lane runs it over v5 instead, which is
      # the only place segmentation, compressed segments, now_in_seconds, keyspace
      # override and METADATA_CHANGED reach a live server.
      #
      # Cassandra only, and only 5-LATEST: ScyllaDB's protocol extensions are defined on
      # top of v4 — SCYLLA_USE_METADATA_ID exists precisely to backport a v5 feature onto
      # v4 — so there is no v5 to negotiate on the Scylla legs.
      #
      # lz4 is the only legal *compressor* on v5; no-compression stays a valid setting,
      # and the step below uses it. Snappy is removed in v5: a v5 server still advertises
      # it in its OPTIONS response, but STARTUP with COMPRESSION=snappy is rejected
      # server-side, and ClusterConfig.Validate refuses any compressor that is not a
      # SegmentCompressor once ProtoVersion >= 5, which would fail every session in the
      # suite. This lane compresses rather than running uncompressed so the
      # compressed-segment path is covered; the step below covers the other half.
      #
      # This is the `protocol-v5` matrix entry, so it boots its own Cassandra cluster
      # in parallel with the v4 `default` job instead of running as that job's tail.
      #
      # TEST_INTEGRATION_TIMEOUT is raised for headroom, not because v5 is slower: in
      # back-to-back local runs v4 and v5 came out at 464s and 467s. The suite is simply
      # close to the 10m default whenever the machine is loaded (280s-470s observed), and
      # overrunning go test's -timeout panics with a goroutine dump instead of reporting
      # the failing test. The default is left alone so only this new lane pays for it.
      - name: Run proto-5 suite with Cassandra ${{ matrix.cassandra-version }}(${{ steps.cassandra-version.outputs.value }})
        if: matrix.suite == 'protocol-v5' && steps.cassandra-version.outputs.value != 'NOT-FOUND'
        run: |
          TEST_CQL_PROTOCOL=5 \
          TEST_COMPRESSOR=lz4 \
          TEST_INTEGRATION_TIMEOUT=20m \
          make test-integration-cassandra

      # The lane above compresses every segment it sends, so on its own it leaves the
      # uncompressed v5 framing with no integration coverage at all: segment.ReadHeader
      # and the writer take a different header layout and CRC for compressed and
      # uncompressed segments, and only the compressed half would be exercised.
      #
      # Scoped with -run rather than a second full suite: the two tests below are the
      # ones whose subject is the framing itself -- TestLargeSizeQuery is the
      # multi-segment split, TestPrepareExecuteMetadataChangedFlag is the v5 half of the
      # result-metadata-id exchange -- so this costs seconds, where repeating the suite
      # would cost another eight minutes. Do not fold it into the lane above as a
      # duplicate; the compressor is the entire point of the difference.
      - name: Run proto-5 uncompressed framing tests with Cassandra ${{ matrix.cassandra-version }}(${{ steps.cassandra-version.outputs.value }})
        if: matrix.suite == 'protocol-v5' && steps.cassandra-version.outputs.value != 'NOT-FOUND'
        run: |
          TEST_CQL_PROTOCOL=5 \
          TEST_COMPRESSOR=no-compression \
          TEST_OPTS="-run 'TestLargeSizeQuery|TestPrepareExecuteMetadataChangedFlag'" \
          make test-integration-cassandra
