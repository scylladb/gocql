name: Shared build

on:
  workflow_call:
    inputs:
      target_commit:
        description: Commit to build
        required: true
        type: string
      arch:
        description: Comma-separated architectures (amd64,arm64)
        required: true
        type: string

permissions:
  contents: read

jobs:
  matrix:
    name: Select build matrix
    runs-on: ubuntu-latest
    outputs:
      arch: ${{ steps.select.outputs.arch }}
    steps:
      - name: Expand architecture list
        id: select
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          python3 - <<'PY'
          import json
          import os

          arch = list(dict.fromkeys(a.strip() for a in os.environ["ARCH"].split(",") if a.strip()))
          if not arch or any(a not in ("amd64", "arm64") for a in arch):
              raise SystemExit("arch must contain amd64 and/or arm64")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"arch={json.dumps(arch, separators=(',', ':'))}", file=output)
          PY

  build:
    name: Build (${{ matrix.arch }})
    needs: [matrix]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      matrix:
        arch: ${{ fromJSON(needs.matrix.outputs.arch) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.target_commit }}

      # Only test-unit's .prepare-pki needs a cache here; CCM, JDK and bin/ belong
      # to the integration jobs. Linting lives in lint.yml.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: matrix.arch == 'amd64'
        with:
          path: testdata/pki
          key: pki-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            pki-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            lz4/go.sum
            tests/bench/go.sum
            go.sum

      - name: Run unit tests
        if: matrix.arch == 'amd64'
        run: make test-unit

      # arm64 exists for the lz4 module's per-arch decode assembly, so it only
      # builds (go test never compiles the `all`-tagged files) and tests lz4.
      - name: Build
        if: matrix.arch == 'arm64'
        run: make build

      - name: Run lz4 unit tests
        if: matrix.arch == 'arm64'
        run: make test-lz4
