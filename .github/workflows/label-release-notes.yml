name: Label support-only release changes

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to classify again
        required: true
        type: number

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  label:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Label support-only PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          if [[ $(jq -r .merged_at "$RUNNER_TEMP/pr.json") == null ]]; then
            echo "PR #$PR_NUMBER has not been merged" >&2
            exit 1
          fi
          changed_files=$(jq -r .changed_files "$RUNNER_TEMP/pr.json")
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$RUNNER_TEMP/pr-files.json"

          # Check every changed path; mixed driver/support PRs stay in the notes.
          # Match the API's file count so truncated results cannot hide driver code.
          eligible=$(jq -r --argjson expected "$changed_files" '
            def support_path:
              test("^docs/|^ci/|^\\.github/|^testdata/|/testdata/|_test\\.go$|\\.md$|^(\\.gitignore|Makefile|codecov\\.yml|integration\\.sh|install_test_deps\\.sh|renovate\\.json)$");
            [.[][]] as $files
            | ($files | length) == $expected
              and ($files | length) > 0
              and all($files[];
                (.filename | support_path)
                and ((.previous_filename // .filename) | support_path))
          ' "$RUNNER_TEMP/pr-files.json")

          if [[ "$eligible" == true ]]; then
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" \
              -f 'labels[]=omit-from-release-notes' --silent
            echo "Excluded PR #$PR_NUMBER from generated release notes"
          else
            echo "Kept PR #$PR_NUMBER in generated release notes"
          fi
