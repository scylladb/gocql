name: Release
run-name: ${{ inputs.mode }} v${{ inputs.version }} @ ${{ inputs.target }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Bare canonical v1 SemVer for both modules (for example, 1.20.0 or 1.20.0-rc.1)
        required: true
        type: string
      target:
        description: Full commit SHA or master (resolved once to an immutable SHA)
        required: true
        type: string
        default: master
      mode:
        description: Validate runs every gate without credentials; publish creates remote state
        required: true
        type: choice
        default: validate
        options: [validate, publish]

concurrency:
  group: gocql-release
  cancel-in-progress: false

permissions:
  contents: read
  issues: read

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      resolved_sha: ${{ steps.validate.outputs.resolved_sha }}
      root_tag: ${{ steps.validate.outputs.root_tag }}
      lz4_tag: ${{ steps.validate.outputs.lz4_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build release controller from workflow revision
        run: go build -trimpath -o "$RUNNER_TEMP/release-helper" ./ci/release
      - name: Preserve release controller for later jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-controller
          path: ${{ runner.temp }}/release-helper
          if-no-files-found: error
          retention-days: 1
      - name: Validate immutable release candidate
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DISPATCH_REF: ${{ github.ref }}
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TARGET: ${{ inputs.target }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: $RUNNER_TEMP/release-helper preflight

  build:
    name: Full Build matrix
    needs: preflight
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
    with:
      target_commit: ${{ needs.preflight.outputs.resolved_sha }}
      arch: amd64,arm64

  integration:
    name: Full Integration matrix
    needs: [preflight, build]
    uses: ./.github/workflows/integration.yml
    permissions:
      contents: read
    with:
      target_commit: ${{ needs.preflight.outputs.resolved_sha }}
      scylla_versions: LATEST,PRIOR,LTS-LATEST,LTS-PRIOR
      cassandra_versions: 5-LATEST,4-LATEST
      arch: amd64,arm64

  pre-release-integration:
    name: Driver compatibility matrix
    needs: preflight
    uses: scylladb/gocql-driver-matrix/.github/workflows/driver-integration-matrix.yml@master
    with:
      driver_ref: ${{ needs.preflight.outputs.resolved_sha }}
      driver_version: ${{ inputs.version }}

  docs-precheck:
    name: Build candidate docs
    needs: preflight
    uses: ./.github/workflows/docs.yml
    with:
      mode: version
      publish: false
      target_ref: ${{ needs.preflight.outputs.resolved_sha }}

  publication-gate:
    name: Final publication gate
    needs: [preflight, build, integration, pre-release-integration, docs-precheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_action: ${{ steps.gate.outputs.release_action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.resolved_sha }}
      - name: Restore release controller from workflow revision
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-controller
          path: ${{ runner.temp }}
      - name: Recheck blockers and remote release state
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_COMMIT: ${{ needs.preflight.outputs.resolved_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          chmod +x "$RUNNER_TEMP/release-helper"
          "$RUNNER_TEMP/release-helper" gate
      - name: Record validation result
        if: inputs.mode == 'validate'
        env:
          RELEASE_ACTION: ${{ steps.gate.outputs.release_action }}
          ROOT_TAG: ${{ needs.preflight.outputs.root_tag }}
          LZ4_TAG: ${{ needs.preflight.outputs.lz4_tag }}
          TARGET_COMMIT: ${{ needs.preflight.outputs.resolved_sha }}
        run: |
          {
            echo "## Release validation passed"
            echo
            echo "- Tags: \`$LZ4_TAG\`, \`$ROOT_TAG\`"
            echo "- Target: \`$TARGET_COMMIT\`"
            echo "- Recovery actions: \`$RELEASE_ACTION\`"
            echo "- No credentials were loaded and no remote state was created."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish signed tag and GitHub Release
    if: inputs.mode == 'publish'
    needs: [preflight, build, integration, publication-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.preflight.outputs.resolved_sha }}
      - name: Restore release controller from workflow revision
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-controller
          path: ${{ runner.temp }}
      - name: Configure Git authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git
      - name: Publish or complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          RELEASE_QUERY_TOKEN: ${{ github.token }}
          RELEASE_TARGET_COMMIT: ${{ needs.preflight.outputs.resolved_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          chmod +x "$RUNNER_TEMP/release-helper"
          "$RUNNER_TEMP/release-helper" publish

  publish-docs:
    name: Publish released docs
    if: inputs.mode == 'publish'
    needs: [preflight, publish]
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      mode: version
      publish: true
      version: ${{ needs.preflight.outputs.root_tag }}
