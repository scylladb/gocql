name: Docs / Publish

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:
    inputs:
      target:
        description: all, master, or a published root release tag such as v1.20.0.
        required: true
        type: string
        default: all

permissions:
  contents: read

jobs:
  select-target:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.select.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select docs target
        id: select
        env:
          EVENT: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" != push ]; then
            echo "target=$REQUESTED_TARGET" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$AFTER")
          if [ -n "$files" ] && \
             ! printf '%s\n' "$files" | grep -Ev '^docs/source/' >/dev/null && \
             ! printf '%s\n' "$files" | grep -Fx 'docs/source/conf.py' >/dev/null; then
            echo 'target=master' >> "$GITHUB_OUTPUT"
          else
            echo 'target=all' >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: select-target
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      target: ${{ needs.select-target.outputs.target }}
      publish: true
