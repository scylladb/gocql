name: Code coverage

on:
  push:
    branches:
      - master
    paths-ignore:
      - "*.md"
      - "docs/**"
      - .github/workflows/docs-*
      - .github/workflows/bench-tests.yml
      - .github/workflows/extended-ci-longevity-large-partitions-with-network-nemesis-1h-test.yml
  pull_request:
    # labeled/unlabeled included so removing disable-coverage-tests
    # re-triggers a run instead of leaving coverage skipped until the next
    # push or reopen.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - .github/workflows/docs-*
      - .github/workflows/bench-tests.yml
      - .github/workflows/extended-ci-longevity-large-partitions-with-network-nemesis-1h-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Measure code coverage
    if: "!contains(github.event.pull_request.labels.*.name, 'disable-coverage-tests')"
    runs-on: ubuntu-latest
    env:
      SCYLLA_VERSION: LATEST
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            /home/runner/.cache/pip
            /home/runner/.local
            /home/runner/.sdkman
            testdata/pki
            bin/
          # CCM, pip and java versions are in Makefile
          key: pr-check-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            lz4/go.sum
            tests/bench/go.sum
            go.sum

      - name: Run unit tests with coverage
        run: make test-unit-coverage

      - name: Get scylla version
        id: scylla-version
        run: make resolve-scylla-version

      - name: Pull CCM image from the cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.scylla-version.outputs.value != 'NOT-FOUND'
        id: ccm-cache
        with:
          path: ~/.ccm/repository
          key: ccm-scylla-${{ runner.os }}-${{ steps.scylla-version.outputs.value }}

      - name: Download ScyllaDB (${{ steps.scylla-version.outputs.value }}) image
        if: steps.ccm-cache.outputs.cache-hit != 'true' && steps.scylla-version.outputs.value != 'NOT-FOUND'
        run: make download-scylla

      - name: Save CCM ScyllaDB image into the cache
        if: steps.ccm-cache.outputs.cache-hit != 'true' && steps.scylla-version.outputs.value != 'NOT-FOUND'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.ccm/repository
          key: ccm-scylla-${{ runner.os }}-${{ steps.scylla-version.outputs.value }}

      - name: Run integration suite with coverage
        if: steps.scylla-version.outputs.value != 'NOT-FOUND'
        run: make test-integration-scylla-coverage

      - name: Run CCM integration suite with coverage
        if: steps.scylla-version.outputs.value != 'NOT-FOUND'
        run: make ccm-test-coverage

      - name: Generate coverage report
        if: always()
        run: make coverage-report

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage-root.html
            coverage-root.out
            coverage-lz4.html
            coverage-lz4.out

      # Codecov ingests the same textfmt profiles the step above archives. One
      # upload per Go module: flags are a property of the upload rather than of
      # the individual file, so a single combined upload could not keep the
      # root/lz4 split that `make coverage-report` already reports. Path fixing
      # (the profiles carry import paths, not repository paths) and everything
      # about how the report is presented live in codecov.yml at the repo root.
      #
      # fail_ci_if_error is off for pull requests from forks: secrets are not
      # available there, so `token` comes through empty and the upload falls
      # back to Codecov's tokenless path for public repositories. That path is
      # best-effort, and a hiccup in it must not be what turns a contributor's
      # pull request red.
      #
      # Unlike the artifact above, these upload only from a run that both
      # succeeded and actually measured everything. A partial profile is not
      # merely noise: on master it becomes the baseline `target: auto`
      # compares the next pull request against, so an artificially low number
      # there reads as a phantom improvement on every pull request after it,
      # with a real regression free to hide inside that margin until the next
      # clean run. The informational statuses in codecov.yml stop a bad number
      # from blocking a merge; they do not stop it from being recorded.
      # Uploading nothing is the better failure: Codecov falls back to the
      # nearest ancestor that does have a report, which leaves the comparison
      # correct rather than wrong.
      #
      # success() covers a step that failed. The NOT-FOUND guard covers the
      # other half, which success() cannot see: resolve-scylla-version exits 0
      # when it can't resolve a version and reports the miss only through its
      # step output, so the integration and CCM steps are *skipped* rather
      # than failed and the job stays green while carrying unit-only coverage
      # -- the same poisoned baseline by a quieter route. The artifact above
      # keeps always(), so the profiles from a failed run remain downloadable
      # either way.
      - name: Upload root module coverage to Codecov
        if: success() && steps.scylla-version.outputs.value != 'NOT-FOUND'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-root.out
          flags: root
          name: root module
          # The file is named explicitly, so there is nothing to be gained from
          # letting the action sweep the tree for anything else report-shaped,
          # nor from the CLI's language plugins (gcov, Xcode, pycoverage): this
          # is a Go repository and none of them have anything to contribute.
          disable_search: true
          plugins: noop
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}

      - name: Upload lz4 module coverage to Codecov
        if: success() && steps.scylla-version.outputs.value != 'NOT-FOUND'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-lz4.out
          flags: lz4
          name: lz4 module
          disable_search: true
          plugins: noop
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}
